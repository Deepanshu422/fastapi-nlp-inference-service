name: CI Pipeline Test & Lint

# Trigger this workflow whenever code is pushed to main or a PR is created
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # Caches pip packages to speed up future runs

      # Step 3: Cache Hugging Face models so GitHub doesn't re-download every time
      - name: Cache Hugging Face Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('app/core/config.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      # Step 4: Install dependencies using the lightweight CPU index
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # Step 5: Execute your automated test suite
      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v